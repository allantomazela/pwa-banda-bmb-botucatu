# A string used to distinguish different Supabase projects on the same host.
project_id = "pwa-banda-bmb-botucatu"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:8080"
additional_redirect_urls = [
  "http://localhost:8080",
  "http://localhost:8080/redefinir-senha",
  "http://localhost:8080/login",
  "http://localhost:8080/recuperar-senha",
]
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true
# Link/OTP de e-mail (confirmação, recovery, etc.) — 4 horas
otp_expiry = 14400

[auth.email.template.confirmation]
subject = "BMB — Confirme seu e-mail (cadastro aguarda aprovação)"
content_path = "./templates/confirmation.html"

[auth.email.template.recovery]
subject = "BMB — Redefinir sua senha"
content_path = "./templates/recovery.html"

[functions.govbr-start]
verify_jwt = true

[functions.govbr-callback]
verify_jwt = false
