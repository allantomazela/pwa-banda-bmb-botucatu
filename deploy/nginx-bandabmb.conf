# Isolado: NÃO altera outros server blocks do Nginx.
# Copiar para: /etc/nginx/sites-available/bandabmb.com.br
# Ativar com: ln -s /etc/nginx/sites-available/bandabmb.com.br /etc/nginx/sites-enabled/
#
# Depois do certbot, o próprio certbot costuma ajustar o bloco HTTPS.

server {
    listen 80;
    listen [::]:80;
    server_name bandabmb.com.br www.bandabmb.com.br;

    root /var/www/bandabmb;
    index index.html;

    # SPA (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache de assets versionados do Vite
    location /assets/ {
        try_files $uri =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        try_files $uri =404;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Segurança básica (não afeta outros sites)
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
